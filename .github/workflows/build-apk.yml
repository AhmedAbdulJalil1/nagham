# ═══════════════════════════════════════════════════════════
#  مصنع بناء تطبيق نغم — يستقبل الملف المضغوط كاملًا
#  GitHub لا يفك ضغط ZIP عند الرفع → هذا الملف يفكّه بنفسه
#  ثم يبني التطبيق → يولّد APK حقيقي في تبويب Releases
# ═══════════════════════════════════════════════════════════
name: بناء تطبيق أندرويد

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      # ═══════ الخطوة الذكية: فك ضغط الملف المضغوط ═══════
      # يبحث عن أي ملف ZIP في المستودع ويفكّه وينقل محتوياته
      # إلى الجذر — يعمل حتى لو بقي ZIP كما هو بعد الرفع
      - name: فك ضغط الملف المضغوط تلقائيًا
        run: |
          set -e
          echo "===== محتويات المستودع قبل الفك ====="
          ls -la
          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "📦 تم العثور على الملف المضغوط: $ZIP"
            echo "🔄 جاري فك الضغط..."
            mkdir -p _unzip
            unzip -o "$ZIP" -d _unzip
            # البحث عن مجلد المشروع الحقيقي (يحتوي index.html)
            if [ -f _unzip/index.html ]; then
              SRC="_unzip"
            else
              SRC="$(find _unzip -name index.html -not -path "*/node_modules/*" | head -1 | xargs dirname 2>/dev/null || echo _unzip)"
            fi
            echo "📂 مصدر الملفات: $SRC"
            # نقل كل الملفات (بما فيها المخفية مثل .github) إلى الجذر
            shopt -s dotglob
            cp -r "$SRC"/* . 2>/dev/null || true
            shopt -u dotglob
            rm -rf _unzip
            # حذف كل الملفات المضغوطة بعد الفك
            find . -maxdepth 3 -type f -name "*.zip" -delete
          fi
          echo "===== محتويات المستودع بعد الفك ====="
          ls -la
          # التحقق من وجود ملفات المشروع
          if [ ! -f index.html ]; then
            echo "❌ لم يتم العثور على index.html بعد فك الضغط!"
            exit 1
          fi
          if [ ! -f package.json ]; then
            echo "❌ لم يتم العثور على package.json بعد فك الضغط!"
            exit 1
          fi
          echo "✅ ملفات المشروع موجودة — نكمل البناء"

      - name: تنظيف المجلدات القديمة لبناء نظيف
        run: rm -rf node_modules dist android || true

      - name: تثبيت Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: تثبيت أدوات أندرويد
        uses: android-actions/setup-android@v3

      - name: تثبيت Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: تثبيت حزم المشروع (Vite + React + Tailwind)
        run: npm install --no-audit --no-fund

      - name: تثبيت أدوات كاباستور (تحويل الويب إلى تطبيق أندرويد)
        run: npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7

      - name: بناء واجهة التطبيق
        run: npm run build

      - name: توليد مشروع أندرويد تلقائيًا
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"com.nagham.app","appName":"نغم","webDir":"dist","backgroundColor":"#08080f"}' > capacitor.config.json
          fi
          npx cap add android

      - name: مزامنة ملفات التطبيق داخل المشروع
        run: npx cap sync android

      - name: تركيب أيقونة نغم على التطبيق
        run: |
          ICON=""
          if [ -f public/icon-512.png ]; then ICON="public/icon-512.png"
          elif [ -f public/icons/icon-512.png ]; then ICON="public/icons/icon-512.png"
          elif [ -f icon-512.png ]; then ICON="icon-512.png"
          fi
          if [ -n "$ICON" ]; then
            echo "🎨 استخدام الأيقونة: $ICON"
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq imagemagick || true
            # 1) أيقونات الشاشة الرئيسية للأجهزة القديمة (مجلدات mipmap)
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $d in
                mdpi) s=48;; hdpi) s=72;; xhdpi) s=96;; xxhdpi) s=144;; xxxhdpi) s=192;;
              esac
              mkdir -p android/app/src/main/res/mipmap-$d
              convert "$ICON" -resize ${s}x${s} android/app/src/main/res/mipmap-$d/ic_launcher.png || true
              cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png 2>/dev/null || true
            done
            # 2) أيقونة أندرويد 8+ التكيفية — إنشاء مجلدات drawable ووضع الصورة بمساحة أمان
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $d in
                mdpi) s=108;; hdpi) s=162;; xhdpi) s=216;; xxhdpi) s=324;; xxxhdpi) s=432;;
              esac
              mkdir -p android/app/src/main/res/drawable-$d
              convert "$ICON" -resize 66% -background none -gravity center -extent ${s}x${s} android/app/src/main/res/drawable-$d/ic_launcher_foreground.png || true
            done
            # 3) إزالة أيقونة المتجه الافتراضية حتى يستخدم أندرويد أيقونتنا
            rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
            echo "✅ تم تركيب الأيقونة بنجاح"
          fi

      - name: بناء ملف APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: تسمية الملف النهائي
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nagham.apk

      - name: رفع الـ APK كمرفق
        uses: actions/upload-artifact@v4
        with:
          name: nagham-apk
          path: nagham.apk

      - name: حذف الإصدار القديم
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nagham-latest --yes --cleanup-tag --repo ${{ github.repository }} || true

      - name: نشر الإصدار الجديد
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nagham-latest
          name: نغم — تطبيق أندرويد
          body: |
            📲 أحدث نسخة من تطبيق نغم (مبنية من الملف المضغوط)

            حمّل ملف nagham.apk وافتحه على هاتفك لتثبيته مباشرة.
            - يعمل بدون إنترنت 100%
            - معادل صوتي + مؤثرات بصرية + قوائم تشغيل + فيديو بملء الشاشة
          files: nagham.apk
          draft: false
          prerelease: false
